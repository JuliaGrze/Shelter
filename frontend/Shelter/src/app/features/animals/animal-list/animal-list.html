<h2>Animals</h2>
<div class="animal-grid">
    @for (animal of animals; track $index) {
        <div class="animal-card" [routerLink]="['/animals', animal.id]">
            <img [src]="animal.photoUrl" [alt]="animal.name" class="animal-photo">

            <div class="animal-info">
                <h3>{{animal.name}}</h3>
                <p><strong>Gatunek: {{animal.speciesName}}</strong></p>
                <p class="sex-chip" [ngClass]="animal.sex.toLowerCase() || 'unknown'">
                    <strong>Płeć: {{animal.sex | sexPl}}</strong>
                </p>
                <p class="status-chip" [ngClass]="(animal.status.toLowerCase() || 'unknown')">
                    <strong>Status: {{animal.status | statusPl}}</strong>
                </p>
                <p class="desc">{{ animal.description }}</p>
                <p class="meta">
                    Urodzony: {{ animal.birthDate }}
                </p>
            </div>

            <button
                class="btn details-btn" 
                [routerLink]="['/animals', animal.id]"
            >Zobacz szczegóły</button>
        </div>
    }
</div>
